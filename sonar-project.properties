sonar.projectKey=personal-finance-frontend
sonar.projectName=Personal Finance Frontend

sonar.sources=app,components,hooks,lib,stores,utils,middleware.ts
sonar.tests=app,components,hooks,lib,stores,utils
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
# components/ui: shadcn-generated components, not maintained by hand.
sonar.exclusions=**/node_modules/**,.next/**,graphify-out/**,public/**,coverage/**,components/ui/**,**/*.test.ts,**/*.test.tsx
# i18n dictionaries: one block per language with the same keys, duplicated by design.
sonar.cpd.exclusions=utils/i18n/messages/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
