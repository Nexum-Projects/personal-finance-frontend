repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        entry: npx prettier --check
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css]
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: tsc
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
